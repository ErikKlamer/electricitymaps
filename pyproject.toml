[project]
name = "emaps-etl"
version = "0.1.0"
description = "Electricity Maps"
authors = [
    {name = "Erik Klamer",email = "53000289+ErikKlamer@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars (>=1.44.2,<2.0.0)",
    "deltalake (>=1.6.6,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "dagster (>=1.13.25,<2.0.0)",
    "dagster-webserver (>=1.13.25,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "emaps_etl", from = "src" }]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
